name: GRETL examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: gretl-runtime-jobs
      - uses: actions/checkout@v6
        with:
          repository: edigonzales/gretl-runtime
          ref: 18eaf3254a16c121362b78406be7c01c95f152c7
          path: gretl-runtime
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build GRETL distribution
        working-directory: gretl-runtime
        run: ./mvnw -B -pl gretl-dist -am -DskipTests package
      - name: Test example scripts
        working-directory: gretl-runtime-jobs
        run: ./scripts/test.sh
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/checkout@v6
        with:
          repository: edigonzales/k8s-job-console
          ref: 0eea467ae0522c775993cb48b652e6f7d2644209
          path: k8s-job-console
      - name: Validate definitions
        working-directory: k8s-job-console
        run: |
          npm ci
          npm run build
          npm run generate
